# Legacy modules that this change set does not touch keep their documented type debt (QUALITY.md); they are
# followed silently so their own errors do not block commits of the modules that import them. Every staged
# file is still fully checked.
[mypy]

[mypy-train_eval,resnet_rank,move_transformer,rank_lib,blend_eval,board_sim,evaluate_decision_features,go_retrieval.*]
follow_imports = silent

# Competition 1's package (c1/go_retrieval) is put on sys.path at run time only.
[mypy-go_retrieval,go_retrieval.*]
ignore_missing_imports = True

# Competition 1 modules imported by opponent_identity keep their own type debt (their mypy.ini mirrors this).
[mypy-competition1_player_identification.*]
follow_imports = silent
